<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <title>Zebra Coffee | Feedback</title>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta name="description" content="Leave your feedback for Zebra Coffee">
        <meta name="author" content="Yelzhan Baurzhanov">
        
        <!-- Requirement: Bootstrap Version 5.3.3 -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
        
        <link rel="stylesheet" href="css/base.css">
        <link rel="stylesheet" href="css/yelzhan.css">
    </head>
    <body>
        <!-- I am using container-fluid here so the header spans the full width of the viewport -->
        <header class="container-fluid text-center py-3">
            <h1>Zebra Coffee</h1>
        </header>

        <!-- Bootstrap responsive navbar -->
        <nav class="navbar navbar-expand-md bg-header mb-4">
            <div class="container">
                <button class="navbar-toggler mx-auto" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse justify-content-center" id="navbarNav">
                    <ul class="navbar-nav gap-3">
                        <li class="nav-item"><a href="index.html" class="nav-link">Home</a></li>
                        <li class="nav-item"><a href="menu.html" class="nav-link">Menu</a></li>
                        <li class="nav-item"><a href="booking.html" class="nav-link">Booking</a></li>
                        <li class="nav-item"><a href="feedback.html" class="nav-link active" aria-current="page">Feedback</a></li>
                        <li class="nav-item"><a href="faq.html" class="nav-link">FAQ</a></li>
                        <li class="nav-item"><a href="register.html" class="nav-link">Register</a></li>
                    </ul>
                </div>
            </div>
        </nav>

        <!-- I am using container here to constrain the main content width -->
        <main class="container my-5">
            <section id="feedback-section">
                <h2 class="text-center mb-5">Leave Your Feedback</h2>
                
                <div class="row g-5 align-items-center">
                    <div class="col-12 col-lg-7">
                        <article class="p-4 border rounded shadow-sm bg-white">
                            
                            <!-- Bootstrap component: Alert, adapted to serve as a welcome message for the form -->
                            <div class="alert alert-info text-center mb-4" role="alert">
                                <strong>We Value Your Opinion!</strong> Your reviews help us improve our drinks and service.
                            </div>

                            <form method="post" action="#">
                                <fieldset>
                                    <legend class="fw-bold fs-4 mb-3 text-center border-bottom pb-2">Feedback Form</legend>
                                    
                                    <div class="row g-3">
                                        <div class="col-md-6">
                                            <label for="fb-name" class="form-label fw-bold">Full Name</label>
                                            <input type="text" class="form-control bg-light" id="fb-name" name="fb-name" required placeholder="Your name">
                                        </div>
                                        
                                        <div class="col-md-6">
                                            <label for="fb-email" class="form-label fw-bold">Email Address</label>
                                            <input type="email" class="form-control bg-light" id="fb-email" name="fb-email" required placeholder="you@example.com">
                                        </div>
                                        
                                        <div class="col-md-6">
                                            <label for="fb-phone" class="form-label fw-bold">Phone Number</label>
                                            <input type="tel" class="form-control bg-light" id="fb-phone" name="fb-phone" placeholder="+7 000 000 0000">
                                        </div>
                                        
                                        <div class="col-md-6">
                                            <label for="fb-date" class="form-label fw-bold">Date of Visit</label>
                                            <input type="date" class="form-control bg-light" id="fb-date" name="fb-date" required>
                                        </div>

                                        <div class="col-md-6">
                                            <label for="fb-rating" class="form-label fw-bold">Rating (1-5)</label>
                                            <input type="number" class="form-control bg-light" id="fb-rating" name="fb-rating" min="1" max="5" required>
                                        </div>

                                        <div class="col-md-6">
                                            <label for="fb-drink" class="form-label fw-bold">Favorite Drink</label>
                                            <select class="form-select bg-light" id="fb-drink" name="fb-drink">
                                                <option value="">Select a drink</option>
                                                <option value="latte">Latte</option>
                                                <option value="cappuccino">Cappuccino</option>
                                                <option value="americano">Americano</option>
                                                <option value="raf">Raf</option>
                                                <option value="other">Other</option>
                                            </select>
                                        </div>

                                        <div class="col-12 mt-3">
                                            <p class="fw-bold mb-2">Order Type:</p>
                                            <div class="form-check form-check-inline">
                                                <input class="form-check-input" type="radio" id="type-dine" name="order-type" value="dine-in" required>
                                                <label class="form-check-label" for="type-dine">Dine-in</label>
                                            </div>
                                            <div class="form-check form-check-inline">
                                                <input class="form-check-input" type="radio" id="type-take" name="order-type" value="takeaway">
                                                <label class="form-check-label" for="type-take">Takeaway</label>
                                            </div>
                                        </div>

                                        <div class="col-12">
                                            <div class="form-check">
                                                <input class="form-check-input" type="checkbox" id="fb-recommend" name="fb-recommend" value="yes">
                                                <label class="form-check-label" for="fb-recommend">I would recommend Zebra Coffee to a friend</label>
                                            </div>
                                        </div>
                                        
                                        <div class="col-12">
                                            <label for="fb-comments" class="form-label fw-bold">Additional Comments</label>
                                            <textarea class="form-control bg-light" id="fb-comments" name="fb-comments" rows="4" placeholder="Tell us about your experience..." required></textarea>
                                        </div>
                                        
                                        <div class="col-12 mt-4 d-flex flex-wrap gap-2">
                                            <!-- Requirement: Four button classes (Default, Size variant, Outline, Disabled) -->
                                            <button type="submit" class="btn btn-dark btn-lg">Submit Feedback</button>
                                            <button type="reset" class="btn btn-outline-secondary btn-lg">Clear Form</button>
                                            <button type="button" class="btn btn-secondary btn-lg" disabled>Attach Photo (Coming Soon)</button>
                                        </div>
                                    </div>
                                </fieldset>
                            </form>
                        </article>
                    </div>

                    <div class="col-12 col-lg-5 text-center">
                        <figure class="m-0">
                            <img src="images/feedback.jpg" class="img-fluid rounded shadow" alt="A customer leaving a review for Zebra Coffee">
                            <figcaption class="text-muted mt-2 fst-italic">Your feedback helps us grow</figcaption>
                        </figure>
                    </div>
                </div>
            </section>
        </main>

        <footer class="container-fluid bg-light text-center py-4 border-top mt-5">
            <p class="mb-1">&copy; 2026 Zebra Coffee</p>
            <address class="mb-0">
                Contact us at <a href="mailto:info@zebracoffee.com" class="text-decoration-none">info@zebracoffee.com</a>
            </address>
        </footer>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmxc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    </body>
</html>
