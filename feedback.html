        <link rel="stylesheet" href="css/yelzhan.css">
    </head>
    <body>
        <header class="bg-header text-center py-4">
    <h1 class="mb-0">Zebra Coffee</h1>
        </header>

        <!-- I am using container here to constrain the main content width -->
        <main class="container my-5">
            <section id="feedback-section">
                <h2 class="text-center mb-5">Leave Your Feedback</h2>
                
                <div class="row g-5 align-items-center">
                    <div class="col-12 col-lg-7">
                        <div class="p-4 border rounded shadow-sm bg-white">
                            
                            <!-- Bootstrap component: Alert, adapted to serve as a welcome message for the form -->
                            <div class="alert alert-info text-center mb-4" role="alert">
                                <strong>We Value Your Opinion!</strong> Your reviews help us improve our drinks and service.
                            </div>

                            <form id="feedback-form">
                                <fieldset>
                                    <legend class="fw-bold fs-4 mb-3 text-center border-bottom pb-2">Feedback Form</legend>
                                    
                                    <div class="row g-3">
                                        <div class="col-md-6">
                                            <label for="fb-name" class="form-label fw-bold">Full Name</label>
                                            <input type="text" class="form-control bg-light" id="fb-name" name="fb-name" required placeholder="Your name">
                                        </div>
                                        
                                        <div class="col-md-6">
                                            <label for="fb-email" class="form-label fw-bold">Email Address</label>
                                            <input type="email" class="form-control bg-light" id="fb-email" name="fb-email" required placeholder="you@example.com">
                                        </div>
                                        
                                        <div class="col-md-6">
                                            <label for="fb-phone" class="form-label fw-bold">Phone Number</label>
                                            <input type="tel" class="form-control bg-light" id="fb-phone" name="fb-phone" placeholder="+7 000 000 0000">
                                        </div>
                                        
                                        <div class="col-md-6">
                                            <label for="fb-date" class="form-label fw-bold">Date of Visit</label>
                                            <input type="date" class="form-control bg-light" id="fb-date" name="fb-date" required>
                                        </div>

                                        <div class="col-md-6">
                                            <label for="fb-rating" class="form-label fw-bold">Rating (1-5)</label>
                                            <input type="number" class="form-control bg-light" id="fb-rating" name="fb-rating" min="1" max="5" required>
                                        </div>

                                        <div class="col-md-6">
                                            <label for="fb-drink" class="form-label fw-bold">Favorite Drink</label>
                                            <select class="form-select bg-light" id="fb-drink" name="fb-drink">
                                                <option value="">Select a drink</option>
                                                <option value="latte">Latte</option>
                                                <option value="cappuccino">Cappuccino</option>
                                                <option value="americano">Americano</option>
                                                <option value="raf">Raf</option>
                                                <option value="other">Other</option>
                                            </select>
                                        </div>

                                        <div class="col-12 mt-3">
                                            <p class="fw-bold mb-2">Order Type:</p>
                                            <div class="form-check form-check-inline">
                                                <input class="form-check-input" type="radio" id="type-dine" name="order-type" value="dine-in" required>
                                                <label class="form-check-label" for="type-dine">Dine-in</label>
                                            </div>
                                            <div class="form-check form-check-inline">
                                                <input class="form-check-input" type="radio" id="type-take" name="order-type" value="takeaway">
                                                <label class="form-check-label" for="type-take">Takeaway</label>
                                            </div>
                                        </div>

                                        <div class="col-12">
                                            <div class="form-check">
                                                <input class="form-check-input" type="checkbox" id="fb-recommend" name="fb-recommend" value="yes">
                                                <label class="form-check-label" for="fb-recommend">I would recommend Zebra Coffee to a friend</label>
                                            </div>
                                        </div>
                                        
                                        <div class="col-12">
                                            <label for="fb-comments" class="form-label fw-bold">Additional Comments</label>
                                            <textarea class="form-control bg-light" id="fb-comments" name="fb-comments" rows="4" placeholder="Tell us about your experience..." required></textarea>
                                        </div>
                                        
                                        <div class="col-12 mt-4 d-flex flex-wrap gap-2">
                                            <button type="submit" id="feedback-submit" class="btn btn-dark btn-lg">Submit Feedback</button>
                                            <button type="reset" class="btn btn-outline-secondary btn-lg"><i class="fa-solid fa-x"></i> Clear Form</button>
                                        </div>
                                    </div>
                                </fieldset>
                                </form>

                                <!-- Containers for future JavaScript: validation errors and confirmation -->
                                <div id="feedback-error" class="alert alert-danger error hidden mt-4 mb-0" role="alert" aria-live="assertive"></div>
                                <div id="feedback-result" class="alert alert-success success hidden mt-4 mb-0" role="status" aria-live="polite"></div>
                            </div>
                    </div>

                    <div class="col-12 col-lg-5 text-center">
                        <figure class="m-0">
                            <img src="images/feedback.jpg" class="img-fluid rounded shadow" alt="A customer leaving a review for Zebra Coffee">
                            <figcaption class="text-muted mt-2 fst-italic">Your feedback helps us grow</figcaption>
                        </figure>
                    </div>
                </div>
            </section>
        </main>
