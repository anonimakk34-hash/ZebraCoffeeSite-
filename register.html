<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <title>Zebra Coffee | Register</title>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta name="description" content="Create a new Zebra Coffee account">
        <meta name="author" content="Yelzhan Baurzhanov">
        
        <!-- Requirement: Bootstrap Version 5.3.3 -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
        
        <!-- Custom CSS loaded after Bootstrap -->
        <link rel="stylesheet" href="css/base.css">
        <link rel="stylesheet" href="css/yelzhan.css">
    </head>
    <body>
        <header class="bg-header text-center py-4">
            <h1 class="mb-0">Zebra Coffee</h1>
        </header>

        <nav class="navbar navbar-expand-md bg-header">
            <div class="container">
                <button class="navbar-toggler ms-auto" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu" aria-controls="navMenu" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navMenu">
                    <ul class="navbar-nav mx-auto gap-2">
                        <li class="nav-item"><a href="index.html" class="nav-link">Home</a></li>
                        <li class="nav-item"><a href="menu.html" class="nav-link">Menu</a></li>
                        <li class="nav-item"><a href="booking.html" class="nav-link">Booking</a></li>
                        <li class="nav-item"><a href="feedback.html" class="nav-link">Feedback</a></li>
                        <li class="nav-item"><a href="faq.html" class="nav-link">FAQ</a></li>
                        <li class="nav-item"><a href="login.html" class="nav-link">Log In</a></li>
                        <li class="nav-item"><a href="register.html" class="nav-link active" aria-current="page">Register</a></li>
                    </ul>
                </div>
            </div>
        </nav>
        <!-- I am using container here to constrain the main content width, keeping it centered on large screens -->
        <main class="container my-5">
            <section id="auth-section">
                <!-- Center the column horizontally -->
                <div class="row justify-content-center">
                    <!-- col-12 for 375px phones, col-md-8 for 768px tablets, col-lg-5 for desktops -->
                    <div class="col-12 col-md-8 col-lg-5">
                        <div class="auth-card p-4 border rounded shadow-sm bg-white">
                            <h2 class="auth-title text-center mb-2">Create Your Account</h2>
                            <p class="auth-subtitle text-center text-muted mb-4">Join Zebra Coffee to book tables and save your favorite orders.</p>
                            <!-- No server yet: submission will be handled by JavaScript -->
                            <form id="register-form">
                                <div class="mb-3">
                                    <label for="register-name" class="form-label fw-bold">Full Name</label>
                                    <input type="text" class="form-control bg-light" id="register-name" name="register-name" required placeholder="Your name">
                                </div>

                                <div class="mb-3">
                                    <label for="register-email" class="form-label fw-bold">Email Address</label>
                                    <input type="email" class="form-control bg-light" id="register-email" name="register-email" required placeholder="you@example.com">
                                </div>

                                <div class="mb-3">
                                    <label for="register-phone" class="form-label fw-bold">Phone Number</label>
                                    <input type="tel" class="form-control bg-light" id="register-phone" name="register-phone" placeholder="+7 000 000 0000">
                                </div>

                                <div class="mb-3">
                                    <label for="register-password" class="form-label fw-bold">Password</label>
                                    <input type="password" class="form-control bg-light" id="register-password" name="register-password" required placeholder="Create a password">
                                </div>

                                <div class="mb-3">
                                    <label for="register-password-confirm" class="form-label fw-bold">Confirm Password</label>
                                    <input type="password" class="form-control bg-light" id="register-password-confirm" name="register-password-confirm" required placeholder="Re-enter your password">
                                </div>

                                <div class="mb-4 form-check mt-3">
                                    <input class="form-check-input" type="checkbox" id="register-terms" name="register-terms" value="yes" required>
                                    <label class="form-check-label text-muted" for="register-terms">I agree to the Terms &amp; Conditions</label>
                                </div>

                                <button type="submit" id="register-submit" class="btn btn-dark w-100 py-2 text-uppercase fw-bold">Register</button>
                            </form>

                            <!-- Containers for future JavaScript: validation errors and confirmation -->
                            <div id="register-error" class="alert alert-danger error hidden mt-4 mb-0" role="alert" aria-live="assertive"></div>
                            <div id="register-result" class="alert alert-success success hidden mt-4 mb-0" role="status" aria-live="polite"></div>

                            <p class="auth-switch text-center mt-4 mb-0 text-muted">
                                Already have an account? <a href="login.html" class="fw-bold text-decoration-none">Log in here</a>
                            </p>
                        </div>
                    </div>
                </div>
            </section>
        </main>
        <footer class="container-fluid bg-light text-center py-4 border-top mt-5">
            <p class="mb-1">&copy; 2026 Zebra Coffee</p>
            <address class="mb-0">
                Call us: <a href="tel:+77470290093" class="text-decoration-none">+7 747 029 0093</a>
                &middot;
                <a href="mailto:info@zebracoffee.com" class="text-decoration-none">info@zebracoffee.com</a>
            </address>
        </footer>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    </body>
</html>
