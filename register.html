<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <title>Zebra Coffee | Register</title>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta name="description" content="Create a new Zebra Coffee account">
        <meta name="author" content="Yelzhan Baurzhanov">
        
        <!-- Requirement: Bootstrap Version 5.3.3 -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
        
        <!-- Custom CSS loaded after Bootstrap -->
        <link rel="stylesheet" href="css/base.css">
        <link rel="stylesheet" href="css/yelzhan.css">
    </head>
    <body>
        <!-- I am using container-fluid here so the header spans the full width of the viewport -->
        <header class="text-center py-3 bg-header">
    <h1>Zebra Coffee</h1>
</header>

<nav class="navbar navbar-expand-md bg-header mb-0">
    <div class="container-fluid justify-content-center">
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse justify-content-center" id="navbarNav">
            <ul class="navbar-nav gap-3">
                <li class="nav-item"><a href="index.html" class="nav-link active" aria-current="page">Home</a></li>
                <li class="nav-item"><a href="menu.html" class="nav-link">Menu</a></li>
                <li class="nav-item"><a href="booking.html" class="nav-link">Booking</a></li>
                <li class="nav-item"><a href="feedback.html" class="nav-link">Feedback</a></li>
                <li class="nav-item"><a href="faq.html" class="nav-link">FAQ</a></li>
                <li class="nav-item"><a href="login.html" class="nav-link">Log In</a></li>
            </ul>
        </div>
    </div>
</nav>
        <!-- I am using container here to constrain the main content width, keeping it centered on large screens -->
        <main class="container my-5">
            <section id="auth-section">
                <!-- Center the column horizontally -->
                <div class="row justify-content-center">
                    <!-- col-12 for 375px phones, col-md-8 for 768px tablets, col-lg-5 for desktops -->
                    <div class="col-12 col-md-8 col-lg-5">
                        <div class="auth-card p-4 border rounded shadow-sm bg-white">
                            <h2 class="auth-title text-center mb-2">Create Your Account</h2>
                            <p class="auth-subtitle text-center text-muted mb-4">Join Zebra Coffee to book tables and save your favorite orders.</p>

                            <!-- The form does not send anything yet — there is no server behind it. -->
                            <form method="post" action="#">
                                <div class="mb-3">
                                    <label for="reg-name" class="form-label fw-bold">Full Name</label>
                                    <input type="text" class="form-control bg-light" id="reg-name" name="reg-name" required placeholder="Your name">
                                </div>

                                <div class="mb-3">
                                    <label for="reg-email" class="form-label fw-bold">Email Address</label>
                                    <input type="email" class="form-control bg-light" id="reg-email" name="reg-email" required placeholder="you@example.com">
                                </div>

                                <div class="mb-3">
                                    <label for="reg-phone" class="form-label fw-bold">Phone Number</label>
                                    <input type="tel" class="form-control bg-light" id="reg-phone" name="reg-phone" placeholder="+7 000 000 0000">
                                </div>

                                <div class="mb-3">
                                    <label for="reg-password" class="form-label fw-bold">Password</label>
                                    <input type="password" class="form-control bg-light" id="reg-password" name="reg-password" required placeholder="Create a password">
                                </div>

                                <div class="mb-3">
                                    <label for="reg-password-confirm" class="form-label fw-bold">Confirm Password</label>
                                    <input type="password" class="form-control bg-light" id="reg-password-confirm" name="reg-password-confirm" required placeholder="Re-enter your password">
                                </div>

                                <div class="mb-4 form-check mt-3">
                                    <input class="form-check-input" type="checkbox" id="reg-terms" name="reg-terms" value="yes" required>
                                    <label class="form-check-label text-muted" for="reg-terms">I agree to the Terms &amp; Conditions</label>
                                </div>

                                <button type="submit" class="btn btn-dark w-100 py-2 text-uppercase fw-bold">Register</button>
                            </form>

                            <p class="auth-switch text-center mt-4 mb-0 text-muted">
                                Already have an account? <a href="login.html" class="fw-bold text-decoration-none">Log in here</a>
                            </p>
                        </div>
                    </div>
                </div>
            </section>
        </main>

        <!-- I am using container-fluid here so the footer spans the full width of the viewport -->
        <footer class="container-fluid bg-light text-center py-4 border-top mt-5">
            <p class="mb-1">&copy; 2026 Zebra Coffee</p>
            <address class="mb-0">
                Call us: <a href="tel:+77470290093" class="text-decoration-none">+7 747 029 0093</a>
            </address>
        </footer>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmxc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    </body>
</html>
